services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-panah_cms}
      POSTGRES_USER: ${DATABASE_USERNAME:-panah}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-panah_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - panah_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-panah} -d ${DATABASE_NAME:-panah_cms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-panah_cms}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-panah}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-panah_dev_password}
      DATABASE_SSL: "false"
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    ports:
      - "1337:1337"
    volumes:
      - cms_uploads:/app/public/uploads

volumes:
  panah_db_data:
  cms_uploads:
